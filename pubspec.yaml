name: flutterai
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  ultralytics_yolo: ^0.3.0

  # Local database (Isar)
  isar: ^3.1.0
  isar_flutter_libs:
    path: local_packages/isar_flutter_libs

  image_picker: ^1.0.8
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  isar_generator: ^3.1.0

flutter:
  assets:
    - assets/models/
  uses-material-design: true
